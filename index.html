<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINI STORE CHECKOUT SYSTEM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>MINI STORE CHECKOUT SYSTEM</h1>
    <p class="subtitle">Enter the customer and product details, then calculate the complete order summary.</p>

    <div class="app-shell">
      <section class="panel" aria-labelledby="checkoutHeading">
        <h2 id="checkoutHeading">Checkout Details</h2>

        <div class="field-grid">
          <div class="field">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Juan Dela Cruz" autocomplete="name">
          </div>

          <div class="field">
            <label for="productCount">Number of Products</label>
            <input type="number" id="productCount" min="1" step="1" value="1">
          </div>

          <div class="field">
            <label for="deliveryOption">Delivery Option</label>
            <select id="deliveryOption">
              <option value="1">Store Pickup</option>
              <option value="2">Standard Delivery</option>
              <option value="3">Express Delivery</option>
            </select>
          </div>
        </div>

        <h2>Products</h2>
        <div id="productsContainer"></div>

        <div class="actions">
          <button type="button" id="calculateBtn">Calculate Order</button>
        </div>

        <p id="validationMessage" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="summaryHeading">
        <h2 id="summaryHeading">Order Summary</h2>
        <div id="orderSummary">
          <p class="empty-summary">The order summary will appear here after calculation.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
